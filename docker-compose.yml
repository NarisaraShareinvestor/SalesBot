# SalesBot — single container on the shared VPS (187.127.218.42), /opt/salesbot.
# Host nginx (zz-salesbot.ohmai.me.conf) proxies salesbot.ohmai.me → 127.0.0.1:8001.
# Everything is named salesbot* so it never collides with the other apps on the box.
services:
  salesbot:
    build: .
    image: salesbot:latest
    container_name: salesbot
    restart: always
    env_file:
      - ./data/.env            # OPENAI_*, AZURE_*, REDIRECT_URI, ADMIN_TOKEN, SMTP_*, EXPIRING_THRESHOLD_DAYS
    environment:
      DATABASE_URL: sqlite:////data/salesbot.db
    volumes:
      - ./data:/data                                       # salesbot.db (+ wal/journal) persists
      - ./data/ae_emails.json:/app/backend/ae_emails.json  # AE→email map persists
      - ./data/user_smtp.json:/app/backend/user_smtp.json  # per-user SMTP persists
      - ./Data:/app/Data                                   # Excel import files (readonly)
      - ./frontend:/app/frontend                           # SPA — edits picked up without rebuild
    ports:
      - "127.0.0.1:8001:8000"   # localhost only — public entry is nginx on 443
    mem_limit: 512m             # box is shared and RAM is tight
