# SalesBot reverse proxy — /etc/nginx/sites-available/salesbot.ohmai.me
# certbot --nginx will add the listen 443 / ssl_certificate lines automatically.
server {
    listen 80;
    server_name salesbot.ohmai.me;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # gpt-4o tool-calling loop can take a while
    }
}
