# SalesBot — /etc/nginx/sites-enabled/zz-salesbot.ohmai.me.conf on 187.127.218.42
#
# This file belongs to SalesBot only — don't put other projects here or edit theirs.
# Keep the `zz-` prefix: sites-enabled/* loads alphabetically and the first block per port
# becomes the default server (currently `sitemap`).
# Every global name here is prefixed `salesbot_` (duplicate zone names crash nginx for everyone).
# No http2 — socket options are set once per socket and nginx 1.24 has no `http2 on;`.

limit_req_zone $binary_remote_addr zone=salesbot_req:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name salesbot.ohmai.me;

    # certbot webroot renewals; everything else → https
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name salesbot.ohmai.me;

    ssl_certificate     /etc/letsencrypt/live/salesbot.ohmai.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salesbot.ohmai.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/salesbot-access.log;
    error_log  /var/log/nginx/salesbot-error.log;

    client_max_body_size 25M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # customer/contract data — keep it out of search engines
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        limit_req zone=salesbot_req burst=40 nodelay;
        # login is checked by the app (signed session cookie on every /api/*)
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # gpt-4o tool-calling loop can take a while
    }
}
